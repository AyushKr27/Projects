<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chatbot Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; width: 720px; height: 480px; overflow:auto; }
    .msg { margin: 8px 0; }
    .user { color: #0a0; }
    .bot { color: #06c; }
    .meta { font-size: 0.85em; color: #666; margin-left: 10px; }
    .suggestions { background: #f8f8f8; padding: 6px; border-radius: 4px; margin-top:6px; }
    button { margin-left: 6px; }
  </style>
</head>
<body>
  <h2>Chatbot Demo</h2>
  <div id="sessionId">Session: (not started)</div>
  <div id="chat"></div>
  <div style="margin-top:10px">
    <input id="input" placeholder="Write a message..." style="width:560px;padding:8px"/>
    <button id="send">Send</button>
    <button id="start">Start Session</button>
    <button id="clear">Clear Context</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionId = null;
    let lastAnalysis = null;

    function append(role, html, meta) {
      const d = document.createElement('div');
      d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      d.innerHTML = `<strong>${role}:</strong> ${html} ${meta ? '<div class="meta">'+meta+'</div>' : ''}`;
      document.getElementById('chat').appendChild(d);
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    function appendHtml(role, html) {
      append(role, html, '');
    }

    socket.on('connect', () => console.log('connected', socket.id));

    socket.on('session_started', (data) => {
      sessionId = data.sessionId;
      document.getElementById('sessionId').textContent = 'Session: ' + sessionId;
      append('bot', 'Session started. Say hi!');
    });

    socket.on('bot_message', (msg) => {
      lastAnalysis = msg.analysis;
      append('bot', msg.text);
      if (msg.analysis) {
        let corr = `<div class="suggestions"><strong>Analysis</strong><br/>`;
        corr += `Original: "${msg.analysis.original}"<br/>`;
        corr += `Corrected: "${msg.analysis.corrected}"<br/>`;
        if (msg.analysis.autocorrectEdits?.length) {
          corr += `Spelling: ${msg.analysis.autocorrectEdits.map(e => `${e.original} → ${e.suggestion}`).join(', ')}<br/>`;
        }
        if (msg.analysis.grammarMatches?.length) {
          corr += `Grammar: ${msg.analysis.grammarMatches.map(m => m.message + (m.replacements.length ? ' (suggest: ' + m.replacements.join('|') + ')' : '')).join(' | ')}<br/>`;
        }
        corr += `<button id="useCorrection">Use corrected text</button>`;
        corr += `</div>`;
        appendHtml('bot', corr);
        document.getElementById('useCorrection')?.addEventListener('click', () => {
          document.getElementById('input').value = lastAnalysis.corrected;
        });
      }
    });

    document.getElementById('start').addEventListener('click', () => {
      socket.emit('start_session', { userId: 'student-demo' });
    });

    document.getElementById('send').addEventListener('click', () => {
      const t = document.getElementById('input').value.trim();
      if (!t) return;
      if (!sessionId) {
        alert('Start session first');
        return;
      }
      append('user', t);
      socket.emit('user_message', { sessionId, text: t });
      document.getElementById('input').value = '';
    });

    document.getElementById('clear').addEventListener('click', () => {
      if (!sessionId) return alert('Start session first');
      socket.emit('clear_context');
    });

    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('send').click();
    });
  </script>
</body>
</html>
